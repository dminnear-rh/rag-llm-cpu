clusterGroup:
  name: prod

  namespaces:
    - rag-llm-cpu
    - vault
    - golang-external-secrets
    - openshift-nfd
    - nvidia-gpu-operator
    - redhat-ods-operator:
        operatorGroup: true
        targetNamespaces: []
    - openshift-serverless:
        operatorGroup: true
        targetNamespaces: []
    - openshift-storage:
        operatorGroup: true
        targetNamespaces:
          - openshift-storage

  subscriptions:
    nfd:
      name: nfd
      namespace: openshift-nfd
    nvidia:
      name: gpu-operator-certified
      namespace: nvidia-gpu-operator
      source: certified-operators
    serverless:
      name: serverless-operator
      namespace: openshift-serverless
    servicemesh:
      name: servicemeshoperator
      namespace: openshift-operators
    rhoai:
      name: rhods-operator
      namespace: redhat-ods-operator
    lvms:
      name: lvms-operator
      namespace: openshift-storage

  applications:
    golang-external-secrets:
      name: golang-external-secrets
      namespace: golang-external-secrets
      chart: golang-external-secrets
      chartVersion: 0.1.*

    vault:
      name: vault
      namespace: vault
      chart: hashicorp-vault
      chartVersion: 0.1.*

    nfd:
      name: nfd
      namespace: openshift-nfd
      path: charts/nfd

    nvidia-config:
      name: nvidia-config
      namespace: nvidia-gpu-operator
      path: charts/nvidia-config

    lvms:
      name: lvms
      namespace: openshift-storage
      path: charts/lvms

    rag-llm-frontend:
      name: rag-llm-frontend
      namespace: rag-llm-cpu
      repoURL: https://github.com/validatedpatterns-sandbox/rag-llm-demo-ui
      chartVersion: main
      path: helm
      extraValueFiles:
        - $patternref/overrides/rag-llm-frontend-values.yaml

    vector-db:
      name: vector-db
      namespace: rag-llm-cpu
      chart: vector-db
      chartVersion: 0.1.*
      extraValueFiles:
        - $patternref/overrides/vector-db-values.yaml

    llm-inference-service:
      name: llm-inference-service
      namespace: rag-llm-cpu
      chart: llm-inference-service
      chartVersion: 0.3.*

    gpt-oss-inference-service:
      name: gpt-oss-inference-service
      namespace: rag-llm-cpu
      chart: llm-inference-service
      chartVersion: 0.3.*
      extraValueFiles:
        - $patternref/overrides/gpt-oss-inference-service-values.yaml
