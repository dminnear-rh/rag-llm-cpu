inferenceService:
  name: gpt-oss-inference-service
  resources:
    requests:
      cpu: "16"
      memory: 32Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: 32Gi
      nvidia.com/gpu: "1"

servingRuntime:
  name: gpt-oss-runtime
  image: kserve/huggingfaceserver:latest
  modelFormat: vLLM
  args:
    - --model_name=gpt-oss-120b
    - --model_id=openai/gpt-oss-120b
